name: Collect historical research sources
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/collect-audit-sources.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/collect_audit_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: goblin-public-source-snapshots
          path: audit_source_snapshots/
          retention-days: 90
